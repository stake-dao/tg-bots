name: Bot Lockers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        description: "Unique ID for Temporal tracking"
        required: false
        default: ""
      reset_chains:
        type: string
        description: "Comma-separated chain ids restarting from the current head (their backlog is skipped)"
        required: false
        default: ""
      checkpoint_overrides:
        type: string
        description: "Chain checkpoints to pin, as <chain id>=<first block to scan> pairs separated by commas"
        required: false
        default: ""

concurrency:
  group: bot-curve-pools
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
  BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
  WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  EXPLORER_KEY: ${{ secrets.EXPLORER_KEY }}

jobs:
  build:
    if: github.event_name != 'schedule' || vars.BOT_CRON_CURVE_POOLS == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: "dispatch_id:${{ github.event.inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt
        shell: bash

      - name: Check required secrets
        run: |
          for key in BOT_API_KEY GITHUB_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
        shell: bash

      - name: Run the lockers script
        run: |
          python script/bots/curve/pools/main.py
        shell: bash
        env:
          PYTHONPATH: script/
          # Keep stdout and stderr interleaved so checkpoint markers and
          # delivery errors appear in order in the run log.
          PYTHONUNBUFFERED: "1"
          PROD: "True"
          BOT_RESET_CHAIN_IDS: ${{ github.event.inputs.reset_chains || '' }}
          BOT_CHECKPOINT_OVERRIDES: ${{ github.event.inputs.checkpoint_overrides || '' }}

name: Bot Votemarket Direct Incentives

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        description: "Unique ID for Temporal tracking"
        required: false
        default: ""

concurrency:
  group: bot-votemarket-incentives
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
  BOT_VOTEMARKET_API_KEY: ${{ secrets.BOT_VOTEMARKET_API_KEY }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
  WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
  EXPLORER_KEY: ${{ secrets.EXPLORER_KEY }}

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: "dispatch_id:${{ github.event.inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt
        shell: bash

      - name: Check required secrets
        run: |
          for key in BOT_VOTEMARKET_API_KEY REDIS_HOST REDIS_PORT REDIS_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
        shell: bash

      - name: Run the Votemarket Direct Incentives bot
        run: |
          python script/bots/votemarket_incentives/main.py
        shell: bash
        env:
          PYTHONPATH: script/
          PROD: "True"

name: Votemarket consumer tests

on:
  pull_request:
    paths:
      - "script/bots/votemarket/**"
      - "script/bots/votemarket_incentives/**"
      - "script/shared/services/stakedao_api.py"
      - "tests/test_votemarket_*.py"
      - ".github/workflows/votemarket-tests.yml"
  push:
    branches: [main]
    paths:
      - "script/bots/votemarket/**"
      - "script/bots/votemarket_incentives/**"
      - "script/shared/services/stakedao_api.py"
      - "tests/test_votemarket_*.py"
      - ".github/workflows/votemarket-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated test dependencies
        run: python -m pip install pytest==8.3.5 httpx==0.28.1 python-dotenv==1.0.1 requests==2.32.3
      - name: Test active notifications and preserved historical readers
        run: >-
          python -m pytest
          tests/test_votemarket_active_bots.py
          tests/test_votemarket_bot_hub.py
          tests/test_votemarket_hub_client.py
          -q

name: Bot Daily recap lockers & SDT

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        description: "Unique ID for Temporal tracking"
        required: false
        default: ""

concurrency:
  group: bot-daily-recap
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
  BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
  WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: "dispatch_id:${{ github.event.inputs.dispatch_id || 'manual' }}"
        if: always()
        run: echo "Temporal tracking"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt
        shell: bash

      - name: Check required secrets
        run: |
          for key in BOT_API_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
        shell: bash

      - name: Run the LL daily recap bot
        run: |
          python script/bots/daily/lockers/main.py
        shell: bash
        env:
          PYTHONPATH: script/
          PROD: "True"

      - name: Run the Strategies daily recap bot
        run: |
          python script/bots/staking_v2_daily/main.py
        shell: bash
        env:
          PYTHONPATH: script/
          PROD: "True"

      - name: Run the Morpho daily recap bot
        run: |
          python script/bots/morpho_daily/main.py
        shell: bash
        env:
          PYTHONPATH: script/
          PROD: "True"
